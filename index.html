<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記帳小本子 (DEMO)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-head">
      <h1>記帳小本子</h1>
      <p class="demo-badge">DEMO / TEST DATA ONLY · 資料只存本瀏覽器</p>
    </header>

    <section class="panel summary" aria-label="本月總支出">
      <div class="summary-main">
        <span class="summary-label">本月總支出</span>
        <strong id="month-total">NT$0</strong>
      </div>
      <div class="summary-stats" id="category-stats"></div>
    </section>

    <section class="panel form" aria-label="新增支出">
      <h2>新增支出</h2>
      <form id="add-form">
        <div class="field">
          <label for="f-amount">金額 (NT$)</label>
          <input type="number" id="f-amount" min="1" step="1" inputmode="decimal" placeholder="0" required>
        </div>
        <div class="field">
          <label for="f-category">分類</label>
          <select id="f-category"></select>
        </div>
        <div class="field">
          <label for="f-date">日期</label>
          <input type="date" id="f-date" required>
        </div>
        <div class="field">
          <label for="f-note">備註（選填）</label>
          <input type="text" id="f-note" maxlength="80" placeholder="例如：午餐">
        </div>
        <button type="submit" class="primary">新增支出</button>
      </form>
    </section>

    <section class="panel list" aria-label="最近支出">
      <div class="list-head">
        <h2>最近支出（最多顯示 30 筆）</h2>
        <button id="btn-clear" class="danger" type="button">清除全部測試資料</button>
      </div>
      <ul id="expense-list"></ul>
      <p id="list-empty" class="empty" hidden>還沒有紀錄——點下方「載入測試資料」或新增一筆。</p>
    </section>

    <footer class="app-foot">
      <button id="btn-seed" type="button">載入測試資料 (DEMO)</button>
      <p>無後端、無登入、無外部 API。清除瀏覽器資料即永久刪除。</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
